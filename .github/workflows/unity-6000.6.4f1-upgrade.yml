name: KAISE Unity 6000.6.4f1 Upgrade Validation

on:
  push:
    branches:
      - upgrade/unity-6000.6.4f1
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity-6000.6.4f1-upgrade.yml"

concurrency:
  group: kaise-unity-upgrade-6000-6-4f1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-build:
    name: Validate upgraded project and build Android
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 20
    env:
      UNITY_EXE: C:\Program Files\Unity\Hub\Editor\6000.6.4f1\Editor\Unity.exe

    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify Unity host and project version
        shell: cmd
        run: |
          @echo off
          if not exist "%UNITY_EXE%" exit /b 20
          "%UNITY_EXE%" -version
          if errorlevel 1 exit /b 21
          findstr /C:"m_EditorVersion: 6000.6.4f1" ProjectSettings\ProjectVersion.txt >nul
          if errorlevel 1 exit /b 30
          echo [PASS] Unity host and project version verified.

      - name: Build Android APK with heartbeat watchdog
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          if not exist Logs mkdir Logs
          del /q "Logs\android-build.log" "Logs\unity-exit.txt" 2>nul
          if exist "Builds\Android\KaiChe-dev.apk" del /q "Builds\Android\KaiChe-dev.apk"

          start "" /b cmd /v:on /c ""%UNITY_EXE%" -batchmode -nographics -quit -stackTraceLogType Full -projectPath "%GITHUB_WORKSPACE%" -buildTarget Android -executeMethod KaiChe.EditorTools.KaiCheAndroidBuild.BuildDevelopmentApk -logFile "%GITHUB_WORKSPACE%\Logs\android-build.log" & echo !errorlevel!>"%GITHUB_WORKSPACE%\Logs\unity-exit.txt""

          set "LASTSIZE=-1"
          set /a STALE=0

          :monitor
          if exist "Logs\unity-exit.txt" goto finished

          if exist "Logs\android-build.log" (
            for %%A in ("Logs\android-build.log") do set "SIZE=%%~zA"
            echo [HEARTBEAT] %TIME% log_bytes=!SIZE! stale_checks=!STALE!
            if "!SIZE!"=="!LASTSIZE!" (
              set /a STALE+=1
            ) else (
              set /a STALE=0
              set "LASTSIZE=!SIZE!"
            )
            if !STALE! GEQ 10 (
              echo [ERROR] Unity log has not changed for 5 minutes.
              type "Logs\android-build.log"
              taskkill /F /IM Unity.exe /T >nul 2>&1
              exit /b 45
            )
          ) else (
            echo [HEARTBEAT] %TIME% waiting_for_log
          )

          timeout /t 30 /nobreak >nul
          goto monitor

          :finished
          set /p RC=<"Logs\unity-exit.txt"
          type "Logs\android-build.log"
          if not "!RC!"=="0" exit /b !RC!
          if not exist "Builds\Android\KaiChe-dev.apk" exit /b 40
          echo [PASS] Android APK created.

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KaiChe-Unity-6000.6.4f1-Android
          path: Builds/Android/KaiChe-dev.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaiChe-Unity-6000.6.4f1-Diagnostic-Log
          path: Logs/android-build.log
          if-no-files-found: warn
          retention-days: 14
