name: KAISE Unity 6000.6.4f1 Upgrade Validation

on:
  push:
    branches:
      - upgrade/unity-6000.6.4f1
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity-6000.6.4f1-upgrade.yml"

concurrency:
  group: kaise-unity-upgrade-6000-6-4f1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-build:
    name: Validate upgraded project and build Android
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 25
    env:
      UNITY_EXE: C:\Program Files\Unity\Hub\Editor\6000.6.4f1\Editor\Unity.exe

    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify Unity host and project version
        shell: cmd
        run: |
          @echo off
          if not exist "%UNITY_EXE%" (
            echo [ERROR] Unity 6000.6.4f1 not found:
            echo %UNITY_EXE%
            exit /b 20
          )
          "%UNITY_EXE%" -version
          if errorlevel 1 exit /b 21
          type ProjectSettings\ProjectVersion.txt
          findstr /C:"m_EditorVersion: 6000.6.4f1" ProjectSettings\ProjectVersion.txt >nul
          if errorlevel 1 (
            echo [ERROR] ProjectVersion.txt is not 6000.6.4f1
            exit /b 30
          )
          echo [PASS] Unity host and project version verified.

      - name: Build Android development APK with live log
        shell: cmd
        run: |
          @echo off
          if exist "Builds\Android\KaiChe-dev.apk" del /q "Builds\Android\KaiChe-dev.apk"
          "%UNITY_EXE%" -batchmode -nographics -quit -stackTraceLogType Full -projectPath "%GITHUB_WORKSPACE%" -buildTarget Android -executeMethod KaiChe.EditorTools.KaiCheAndroidBuild.BuildDevelopmentApk -logFile -
          set "RC=%ERRORLEVEL%"
          if not "%RC%"=="0" (
            echo [ERROR] Unity Android build exited with code %RC%.
            exit /b %RC%
          )
          if not exist "Builds\Android\KaiChe-dev.apk" (
            echo [ERROR] APK was not produced.
            exit /b 40
          )
          echo [PASS] Android APK created.

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: KaiChe-Unity-6000.6.4f1-Android
          path: Builds/Android/KaiChe-dev.apk
          if-no-files-found: error
          retention-days: 14
