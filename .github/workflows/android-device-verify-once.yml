name: Verify Latest KaiChe APK on Device

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/android-device-verify-once.yml"

concurrency:
  group: kaise-android-device-verify-once
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-device:
    name: Install, launch and verify latest KaiChe APK
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 15
    env:
      ADB_EXE: C:\Program Files\Unity\Hub\Editor\6000.6.4f1\Editor\Data\PlaybackEngines\AndroidPlayer\SDK\platform-tools\adb.exe
      APK_PATH: C:\actions-runner-kaise\local-builds\KaiChe-dev.apk
      APK_SHA_PATH: C:\actions-runner-kaise\local-builds\KaiChe-dev.sha
      EXPECTED_APK_SHA: a906411df212d264d26078caf10c2db77f2c483f
      PACKAGE_ID: com.kaiche.rpg
      ADB_MDNS: 1
      ADB_MDNS_OPENSCREEN: 0

    steps:
      - name: Verify persisted APK source
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          if not exist Logs mkdir Logs
          if not exist "%ADB_EXE%" (
            echo [ERROR] adb.exe not found: %ADB_EXE%
            exit /b 20
          )
          if not exist "%APK_PATH%" (
            echo [ERROR] APK not found: %APK_PATH%
            exit /b 21
          )
          if not exist "%APK_SHA_PATH%" (
            echo [ERROR] APK source SHA file not found: %APK_SHA_PATH%
            exit /b 22
          )
          set /p APK_SHA=<"%APK_SHA_PATH%"
          if /I not "!APK_SHA!"=="%EXPECTED_APK_SHA%" (
            echo [ERROR] APK source SHA mismatch. expected=%EXPECTED_APK_SHA% actual=!APK_SHA!
            exit /b 23
          )
          for %%A in ("%APK_PATH%") do (
            echo [PASS] APK source SHA verified: !APK_SHA!
            echo [PASS] APK path: %%~fA
            echo [PASS] APK size: %%~zA bytes
          )

      - name: Recover and verify Android device
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          if not exist Logs mkdir Logs
          del /q Logs\device-adb-*.txt 2>nul

          "%ADB_EXE%" version > Logs\device-adb-version.txt 2>&1
          "%ADB_EXE%" devices -l > Logs\device-adb-before.txt 2>&1
          "%ADB_EXE%" get-state >nul 2>&1
          if not errorlevel 1 goto device_ready

          echo [INFO] No online device; trying adb reconnect. > Logs\device-adb-reconnect.txt
          "%ADB_EXE%" reconnect >> Logs\device-adb-reconnect.txt 2>&1
          ping -n 4 127.0.0.1 >nul
          "%ADB_EXE%" get-state >nul 2>&1
          if not errorlevel 1 goto device_ready

          echo [INFO] Restarting adb server and checking mDNS. >> Logs\device-adb-reconnect.txt
          "%ADB_EXE%" kill-server >> Logs\device-adb-reconnect.txt 2>&1
          "%ADB_EXE%" start-server >> Logs\device-adb-reconnect.txt 2>&1
          ping -n 5 127.0.0.1 >nul
          "%ADB_EXE%" mdns services > Logs\device-adb-mdns.txt 2>&1
          for /f "tokens=1,2,3,4" %%A in ('findstr /C:"_adb-tls-connect._tcp" Logs\device-adb-mdns.txt') do (
            set "ENDPOINT="
            if "%%B"=="_adb-tls-connect._tcp" set "ENDPOINT=%%C"
            if "%%C"=="_adb-tls-connect._tcp" set "ENDPOINT=%%D"
            if defined ENDPOINT (
              echo [INFO] Trying !ENDPOINT! >> Logs\device-adb-reconnect.txt
              "%ADB_EXE%" connect !ENDPOINT! >> Logs\device-adb-reconnect.txt 2>&1
              ping -n 3 127.0.0.1 >nul
              "%ADB_EXE%" get-state >nul 2>&1
              if not errorlevel 1 goto device_ready
            )
          )

          "%ADB_EXE%" devices -l > Logs\device-adb-after.txt 2>&1
          echo [ERROR] No online Android device is available through ADB.
          type Logs\device-adb-after.txt
          exit /b 30

          :device_ready
          "%ADB_EXE%" devices -l > Logs\device-adb-after.txt 2>&1
          "%ADB_EXE%" get-state > Logs\device-adb-state.txt 2>&1
          if errorlevel 1 exit /b 31
          echo [PASS] Android device online.
          type Logs\device-adb-after.txt

      - name: Install latest KaiChe APK
        shell: cmd
        run: |
          @echo off
          "%ADB_EXE%" install -r "%APK_PATH%" > Logs\device-install.txt 2>&1
          set "RC=%ERRORLEVEL%"
          type Logs\device-install.txt
          if not "%RC%"=="0" exit /b 40
          "%ADB_EXE%" shell pm path %PACKAGE_ID% > Logs\device-package-path.txt 2>&1
          if errorlevel 1 exit /b 41
          findstr /C:"package:" Logs\device-package-path.txt >nul
          if errorlevel 1 exit /b 42
          echo [PASS] KaiChe APK installed and package path verified.

      - name: Launch and verify KaiChe process
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          "%ADB_EXE%" logcat -c
          "%ADB_EXE%" shell am force-stop %PACKAGE_ID% >nul 2>&1
          "%ADB_EXE%" shell monkey -p %PACKAGE_ID% -c android.intent.category.LAUNCHER 1 > Logs\device-launch.txt 2>&1
          if errorlevel 1 (
            type Logs\device-launch.txt
            exit /b 50
          )
          ping -n 9 127.0.0.1 >nul
          "%ADB_EXE%" shell pidof %PACKAGE_ID% > Logs\device-pid-first.txt 2>&1
          set /p APP_PID=<Logs\device-pid-first.txt
          if "!APP_PID!"=="" (
            echo [ERROR] KaiChe process is not running after launch.
            exit /b 51
          )
          ping -n 8 127.0.0.1 >nul
          "%ADB_EXE%" shell pidof %PACKAGE_ID% > Logs\device-pid-stable.txt 2>&1
          set /p APP_PID_STABLE=<Logs\device-pid-stable.txt
          if "!APP_PID_STABLE!"=="" (
            echo [ERROR] KaiChe process stopped during stability check.
            exit /b 52
          )
          "%ADB_EXE%" logcat -d -t 4000 > Logs\device-logcat.txt 2>&1
          "%ADB_EXE%" exec-out screencap -p > Logs\device-screen.png 2>nul
          if not exist Logs\device-screen.png exit /b 53
          for %%A in (Logs\device-screen.png) do if %%~zA LSS 1000 exit /b 54
          echo [PASS] KaiChe launched and remained alive. PID=!APP_PID_STABLE!
          echo [PASS] Device title screenshot captured.

      - name: Enter game and capture runtime screen
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          "%ADB_EXE%" shell input tap 720 1840
          ping -n 9 127.0.0.1 >nul
          "%ADB_EXE%" shell pidof %PACKAGE_ID% > Logs\device-game-pid.txt 2>&1
          set /p GAME_PID=<Logs\device-game-pid.txt
          if "!GAME_PID!"=="" (
            echo [ERROR] KaiChe process stopped after entering the game.
            exit /b 60
          )
          "%ADB_EXE%" logcat -d -t 6000 > Logs\device-game-logcat.txt 2>&1
          "%ADB_EXE%" exec-out screencap -p > Logs\device-game-screen.png 2>nul
          if not exist Logs\device-game-screen.png exit /b 61
          for %%A in (Logs\device-game-screen.png) do if %%~zA LSS 1000 exit /b 62
          echo [PASS] KaiChe entered the game and remained alive. PID=!GAME_PID!
          echo [PASS] In-game screenshot captured.

      - name: Upload device verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaiChe-Device-Verify-a906411df212d264d26078caf10c2db77f2c483f
          path: |
            Logs/device-adb-*.txt
            Logs/device-install.txt
            Logs/device-package-path.txt
            Logs/device-launch.txt
            Logs/device-pid-first.txt
            Logs/device-pid-stable.txt
            Logs/device-logcat.txt
            Logs/device-screen.png
            Logs/device-game-pid.txt
            Logs/device-game-logcat.txt
            Logs/device-game-screen.png
          if-no-files-found: warn
          retention-days: 14
