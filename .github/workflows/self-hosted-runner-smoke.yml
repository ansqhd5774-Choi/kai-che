name: KAISE Self-hosted Runner Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/self-hosted-runner-smoke.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/self-hosted-runner-smoke.yml"

jobs:
  smoke:
    name: Verify KAISE Windows Runner
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify runner and discover Unity
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          echo KAISE_RUNNER_OK
          echo COMPUTERNAME=%COMPUTERNAME%
          echo PROCESSOR_ARCHITECTURE=%PROCESSOR_ARCHITECTURE%
          echo PROJECT_ROOT=%CD%
          echo.
          echo === Project Unity version ===
          type ProjectSettings\ProjectVersion.txt
          findstr /C:"m_EditorVersion: 6000.3.12f1" ProjectSettings\ProjectVersion.txt >nul
          if errorlevel 1 (
            echo [ERROR] ProjectVersion.txt does not match 6000.3.12f1.
            exit /b 21
          )
          echo PROJECT_VERSION_OK
          echo.
          echo === Search common Unity Hub locations ===
          set "UNITY_FOUND="
          for %%R in ("C:\Program Files\Unity\Hub\Editor" "D:\Program Files\Unity\Hub\Editor" "E:\Program Files\Unity\Hub\Editor" "C:\Unity\Hub\Editor" "D:\Unity\Hub\Editor" "E:\Unity\Hub\Editor") do (
            if exist "%%~R" (
              echo [FOUND ROOT] %%~R
              dir /s /b "%%~R\Unity.exe" 2>nul
              for /f "delims=" %%U in ('dir /s /b "%%~R\Unity.exe" 2^>nul') do (
                echo [UNITY_EXE] %%U
                set "UNITY_FOUND=%%U"
              )
            )
          )
          echo.
          if not defined UNITY_FOUND (
            echo [ERROR] Unity.exe was not found in common Unity Hub locations.
            exit /b 20
          )
          echo UNITY_PATH_DISCOVERED=%UNITY_FOUND%
          echo RUNNER_AND_PROJECT_OK
