name: Unity Android Build

# The self-hosted PC runner executes trusted develop builds and the dedicated
# 35-library integration validation branch. No pull_request trigger is configured.
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - feature/35-libs-integration-r1
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity-android-build.yml"

concurrency:
  group: kaise-unity-android-selfhosted
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feature/35-libs-integration-r1'
    name: Build Android APK on PC
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 40
    env:
      UNITY_EXE: C:\Program Files\Unity\Hub\Editor\6000.6.4f1\Editor\Unity.exe
      LOCAL_APK_DIR: C:\actions-runner-kaise\local-builds

    steps:
      - name: Ensure Git is on PATH
        shell: cmd
        run: |
          @echo off
          if not exist "C:\Program Files\Git\cmd\git.exe" (
            echo [ERROR] Git executable not found.
            exit /b 22
          )
          echo C:\Program Files\Git\cmd>>"%GITHUB_PATH%"
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
          "C:\Program Files\Git\cmd\git.exe" --version

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          clean: false

      - name: Verify Unity host and project version
        shell: cmd
        run: |
          @echo off
          if not exist "%UNITY_EXE%" exit /b 20
          "%UNITY_EXE%" -version
          if errorlevel 1 exit /b 21
          findstr /C:"m_EditorVersion: 6000.6.4f1" ProjectSettings\ProjectVersion.txt >nul
          if errorlevel 1 exit /b 30
          echo [PASS] Unity host and project version verified.

      - name: Reset stale Unity Bee build state
        shell: cmd
        run: |
          @echo off
          if exist "Library\Bee" (
            echo [INFO] Removing stale Library\Bee state.
            rmdir /S /Q "Library\Bee"
          )
          if exist "Library\BurstCache" (
            echo [INFO] Removing stale Library\BurstCache state.
            rmdir /S /Q "Library\BurstCache"
          )
          if exist "Library\Bee" (
            echo [ERROR] Library\Bee could not be fully removed.
            exit /b 31
          )
          if exist "Library\BurstCache" (
            echo [ERROR] Library\BurstCache could not be fully removed.
            exit /b 32
          )
          echo [PASS] Unity Bee/Burst build state reset.

      - name: Build Android APK
        timeout-minutes: 30
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          if not exist Logs mkdir Logs
          del /q "Logs\android-build.log" 2>nul
          if exist "Builds\Android\KaiChe-dev.apk" del /q "Builds\Android\KaiChe-dev.apk"
          if exist "%LOCAL_APK_DIR%\KaiChe-dev.apk" del /q "%LOCAL_APK_DIR%\KaiChe-dev.apk"
          if exist "%LOCAL_APK_DIR%\KaiChe-dev.sha" del /q "%LOCAL_APK_DIR%\KaiChe-dev.sha"

          echo [INFO] Starting Unity Android build in foreground.
          "%UNITY_EXE%" -batchmode -nographics -quit -stackTraceLogType Full -projectPath "%GITHUB_WORKSPACE%" -buildTarget Android -executeMethod KaiChe.EditorTools.KaiCheAndroidBuild.BuildDevelopmentApk -logFile "%GITHUB_WORKSPACE%\Logs\android-build.log"
          set "RC=!ERRORLEVEL!"

          if not "!RC!"=="0" (
            echo [ERROR] Unity exited with code !RC!.
            if exist "Logs\android-build.log" type "Logs\android-build.log"
            exit /b !RC!
          )
          if not exist "Builds\Android\KaiChe-dev.apk" (
            echo [ERROR] Unity exited successfully but APK is missing.
            if exist "Logs\android-build.log" type "Logs\android-build.log"
            exit /b 40
          )
          for %%A in ("Builds\Android\KaiChe-dev.apk") do echo [PASS] Android APK created: %%~zA bytes.

      - name: Persist APK on runner
        if: success()
        shell: cmd
        run: |
          @echo off
          if not exist "%LOCAL_APK_DIR%" mkdir "%LOCAL_APK_DIR%"
          copy /Y "Builds\Android\KaiChe-dev.apk" "%LOCAL_APK_DIR%\KaiChe-dev.apk"
          if errorlevel 1 exit /b 41
          if not exist "%LOCAL_APK_DIR%\KaiChe-dev.apk" exit /b 42
          >"%LOCAL_APK_DIR%\KaiChe-dev.sha" echo %GITHUB_SHA%
          if not exist "%LOCAL_APK_DIR%\KaiChe-dev.sha" exit /b 43
          set /p LOCAL_APK_SHA=<"%LOCAL_APK_DIR%\KaiChe-dev.sha"
          if /I not "%LOCAL_APK_SHA%"=="%GITHUB_SHA%" exit /b 44
          for %%A in ("%LOCAL_APK_DIR%\KaiChe-dev.apk") do echo [PASS] Local APK persisted: %%~fA (%%~zA bytes)
          echo [PASS] Local APK source SHA persisted: %GITHUB_SHA%

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KaiChe-Android-${{ github.sha }}
          path: Builds/Android/KaiChe-dev.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unity build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaiChe-Android-Log-${{ github.sha }}
          path: Logs/android-build.log
          if-no-files-found: warn
          retention-days: 14
