name: Unity Android Build (GitHub-hosted)

# Distinct name avoids triggering legacy PC-only workflow_run device jobs.
# Repository Actions must be enabled after restoring a deleted repository.
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity-android-build.yml"

concurrency:
  group: kaise-android-hosted-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK on GitHub
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

    steps:
      - name: Check Unity activation configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$UNITY_EMAIL" ]] || missing+=(UNITY_EMAIL)
          [[ -n "$UNITY_PASSWORD" ]] || missing+=(UNITY_PASSWORD)
          if [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]]; then
            missing+=("UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro)")
          fi
          if (( ${#missing[@]} )); then
            printf '::error::Missing Unity Actions secrets: %s\n' "${missing[*]}"
            printf 'Unity activation is required. See docs/GITHUB_ACTIONS.md.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Read project Unity version
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt | tr -d '\r')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+[abfp][0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Android Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Unity-Android-${{ runner.os }}-${{ steps.unity.outputs.version }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Unity-Android-${{ runner.os }}-${{ steps.unity.outputs.version }}-

      - name: Build Android APK
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        with:
          unityVersion: ${{ steps.unity.outputs.version }}
          targetPlatform: Android
          buildMethod: KaiChe.EditorTools.KaiCheAndroidBuild.BuildDevelopmentApk
          versioning: None

      - name: Verify APK and record source commit
        shell: bash
        run: |
          set -euo pipefail
          test -s Builds/Android/KaiChe-dev.apk
          printf '%s\n' "$GITHUB_SHA" > Builds/Android/KaiChe-dev.sha
          sha256sum Builds/Android/KaiChe-dev.apk > Builds/Android/KaiChe-dev.apk.sha256

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: KaiChe-Android-${{ github.sha }}
          path: |
            Builds/Android/KaiChe-dev.apk
            Builds/Android/KaiChe-dev.sha
            Builds/Android/KaiChe-dev.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unity build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaiChe-Android-Log-${{ github.sha }}
          path: |
            build/**/*.log
            Logs/**/*.log
          if-no-files-found: ignore
          retention-days: 14
