name: Unity Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/unity-android-build.yml"

concurrency:
  group: kaise-unity-android-selfhosted
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 12
    env:
      UNITY_EXE: C:\Program Files\Unity\Hub\Editor\6000.6.4f1\Editor\Unity.exe
      LOCAL_APK_DIR: C:\actions-runner-kaise\local-builds
      LOCAL_LOG_DIR: C:\actions-runner-kaise\local-build-logs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          clean: false

      - name: Verify Unity host and project version
        shell: cmd
        run: |
          @echo off
          if not exist "%UNITY_EXE%" exit /b 20
          "%UNITY_EXE%" -version
          if errorlevel 1 exit /b 21
          findstr /C:"m_EditorVersion: 6000.6.4f1" ProjectSettings\ProjectVersion.txt >nul
          if errorlevel 1 exit /b 30
          echo [PASS] Unity host and project version verified.

      - name: Build Android APK
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          if not exist Logs mkdir Logs
          if not exist "%LOCAL_LOG_DIR%" mkdir "%LOCAL_LOG_DIR%"
          del /q "Logs\android-build.log" 2>nul
          if exist "Builds\Android\KaiChe-dev.apk" del /q "Builds\Android\KaiChe-dev.apk"
          if exist "%LOCAL_APK_DIR%\KaiChe-dev.apk" del /q "%LOCAL_APK_DIR%\KaiChe-dev.apk"
          set "PERSISTENT_LOG=%LOCAL_LOG_DIR%\android-build-%GITHUB_RUN_ID%.log"
          del /q "%PERSISTENT_LOG%" 2>nul

          "%UNITY_EXE%" -batchmode -nographics -quit -stackTraceLogType Full -projectPath "%GITHUB_WORKSPACE%" -buildTarget Android -executeMethod KaiChe.EditorTools.KaiCheAndroidBuild.BuildDevelopmentApk -logFile "%PERSISTENT_LOG%"
          set "RC=%ERRORLEVEL%"

          if exist "%PERSISTENT_LOG%" copy /Y "%PERSISTENT_LOG%" "Logs\android-build.log" >nul
          if exist "Logs\android-build.log" type "Logs\android-build.log"
          if not "%RC%"=="0" (
            echo [ERROR] Unity exited with code %RC%.
            exit /b %RC%
          )
          if not exist "Builds\Android\KaiChe-dev.apk" (
            echo [ERROR] Unity exited successfully but APK is missing.
            exit /b 40
          )
          echo [PASS] Android APK created.

      - name: Persist APK on runner
        if: success()
        shell: cmd
        run: |
          @echo off
          if not exist "%LOCAL_APK_DIR%" mkdir "%LOCAL_APK_DIR%"
          copy /Y "Builds\Android\KaiChe-dev.apk" "%LOCAL_APK_DIR%\KaiChe-dev.apk"
          if errorlevel 1 exit /b 41
          if not exist "%LOCAL_APK_DIR%\KaiChe-dev.apk" exit /b 42
          for %%A in ("%LOCAL_APK_DIR%\KaiChe-dev.apk") do echo [PASS] Local APK persisted: %%~fA (%%~zA bytes)

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KaiChe-Android-${{ github.sha }}
          path: Builds/Android/KaiChe-dev.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unity build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaiChe-Android-Log-${{ github.sha }}
          path: Logs/android-build.log
          if-no-files-found: warn
          retention-days: 14
