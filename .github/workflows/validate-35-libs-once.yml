name: Validate 35 Libraries Once

on:
  push:
    branches:
      - feature/35-libs-integration-r1
    paths:
      - .github/workflows/validate-35-libs-once.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Execute 35-library integration trace gate
        shell: cmd
        run: Tools\validate-35-libs.cmd
