name: Update Sprite Foundry device gate once

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/update-foundry-device-gate-once.yml

permissions:
  contents: write

jobs:
  patch-device-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Patch device validation
        run: python3 .github/scripts/patch-foundry-device-gate.py
      - name: Commit device gate and remove temporary files
        run: |
          git rm -f .github/workflows/update-foundry-device-gate-once.yml
          git rm -f .github/workflows/cancel-stale-spritefoundry-build-once.yml || true
          git rm -f .github/scripts/patch-foundry-device-gate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/android-device-install.yml
          git diff --cached --check
          git commit -m "ci(device): validate Sprite Foundry 8-direction player"
          git push origin HEAD:develop
