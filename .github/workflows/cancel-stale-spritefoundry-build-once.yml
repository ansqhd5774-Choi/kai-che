name: Cancel stale Sprite Foundry Android build once

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/cancel-stale-spritefoundry-build-once.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-run:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale self-hosted Android run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GH_REPO}/actions/runs/38214626010/cancel" || true
          echo "Requested cancellation for run 38214626010"
