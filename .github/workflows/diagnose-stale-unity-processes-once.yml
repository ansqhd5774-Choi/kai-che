name: Force-cancel superseded Android build once

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/diagnose-stale-unity-processes-once.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-superseded-build:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel superseded Android run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/${GH_REPO}/actions/runs/38222215897/force-cancel"
          echo "Force-cancellation requested for 38222215897"
