name: Diagnose stalled Unity Android build once

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/diagnose-stale-unity-processes-once.yml

permissions:
  contents: read

jobs:
  diagnose-runner:
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 10
    steps:
      - name: Inspect build processes and outputs
        shell: cmd
        run: |
          @echo off
          echo ==== Unity processes ====
          tasklist /FI "IMAGENAME eq Unity.exe"
          echo ==== Bee backend processes ====
          tasklist /FI "IMAGENAME eq bee_backend.exe"
          echo ==== dotnet processes ====
          tasklist /FI "IMAGENAME eq dotnet.exe"
          echo ==== Java processes ====
          tasklist /FI "IMAGENAME eq java.exe"
          echo ==== Gradle processes ====
          tasklist /FI "IMAGENAME eq gradle*"
          echo ==== APK outputs ====
          if exist "Builds\Android\KaiChe-dev.apk" (
            for %%A in ("Builds\Android\KaiChe-dev.apk") do echo APK_WORKSPACE_FOUND %%~zA bytes
          ) else (
            echo APK_WORKSPACE_MISSING
          )
          if exist "C:\actions-runner-kaise\local-builds\KaiChe-dev.apk" (
            for %%A in ("C:\actions-runner-kaise\local-builds\KaiChe-dev.apk") do echo APK_LOCAL_FOUND %%~zA bytes
          ) else (
            echo APK_LOCAL_MISSING
          )
          echo ==== Unity build log ====
          if exist "Logs\android-build.log" (
            for %%A in ("Logs\android-build.log") do echo LOG_FOUND %%~zA bytes
            type "Logs\android-build.log"
          ) else (
            echo LOG_MISSING
          )

      - name: Upload stalled Unity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaiChe-Stalled-Unity-Diagnostic-${{ github.sha }}
          path: Logs/android-build.log
          if-no-files-found: warn
          retention-days: 7
