name: Force-cancel stalled Android build once

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/diagnose-stale-unity-processes-once.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-stalled-build:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel stalled Android run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/${GH_REPO}/actions/runs/38223400097/force-cancel" || true
          echo "Force-cancellation requested for 38223400097"
