name: Collect Unity Bee stall diagnostics once

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/diagnose-stale-unity-processes-once.yml

permissions:
  contents: read

jobs:
  collect-bee:
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 10
    steps:
      - name: Inventory Bee stall files
        shell: cmd
        run: |
          @echo off
          echo ==== Bee trace files ====
          dir /S /B "Library\Bee\*.traceevents" 2>nul
          echo ==== Player DAG files ====
          dir /B "Library\Bee\Player4f25db9e*" 2>nul
          echo ==== Key file details ====
          for %%F in ("Library\Bee\backend1.traceevents" "Library\Bee\backend2.traceevents" "Library\Bee\backend3.traceevents" "Library\Bee\backend4.traceevents" "Library\Bee\Player4f25db9e.dag" "Library\Bee\Player4f25db9e.dag.json" "Library\Bee\Player4f25db9e-inputdata.json") do (
            if exist %%F dir %%F
          )

      - name: Upload Bee diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaiChe-Bee-Stall-Diagnostic-${{ github.sha }}
          path: |
            Logs/android-build.log
            Library/Bee/backend*.traceevents
            Library/Bee/Player4f25db9e.dag
            Library/Bee/Player4f25db9e.dag.json
            Library/Bee/Player4f25db9e-inputdata.json
          if-no-files-found: warn
          retention-days: 7
