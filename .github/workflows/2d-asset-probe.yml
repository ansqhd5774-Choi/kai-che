name: 2D Local Asset Import Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/2d-reboot-r1
    paths:
      - ".github/workflows/2d-asset-probe.yml"
      - "external-assets/2d/candidates-r6/**"

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 15

    steps:
      - name: Locate extracted Pico Heroes folder
        shell: cmd
        run: |
          @echo off
          set "ROOT=C:\actions-runner-kaise\local-assets\PicoHeroes"
          if not exist "%ROOT%\" (
            echo [ERROR] Folder not found: %ROOT%
            exit /b 20
          )
          echo %ROOT%>asset-root.txt
          echo [PASS] Found extracted asset folder: %ROOT%

      - name: Inspect Mage files and required states
        shell: cmd
        run: |
          @echo off
          setlocal EnableDelayedExpansion
          set /p ROOT=<asset-root.txt
          dir /s /b "%ROOT%" > asset-filelist.txt
          findstr /I /C:"mage" asset-filelist.txt > mage-filelist.txt
          if errorlevel 1 (
            echo [ERROR] No Mage file/path found under %ROOT%
            exit /b 22
          )
          echo [PASS] Mage files found.

          set "MISS=0"
          >state-report.txt echo Pico Heroes Mage state probe
          for %%S in (idle walk attack hit death) do (
            findstr /I /C:"%%S" mage-filelist.txt >nul
            if errorlevel 1 (
              echo [ERROR] Missing Mage state token: %%S
              >>state-report.txt echo FAIL %%S
              set "MISS=1"
            ) else (
              echo [PASS] Mage state token: %%S
              >>state-report.txt echo PASS %%S
            )
          )
          if "!MISS!"=="1" exit /b 23

      - name: Detect exact 8-direction coverage
        shell: cmd
        run: |
          @echo off
          setlocal EnableDelayedExpansion
          set "PASSCOUNT=0"
          >direction-report.txt echo Pico Heroes Mage 8-direction probe

          for %%D in (north northeast east southeast south southwest west northwest) do (
            findstr /I /C:"%%D" mage-filelist.txt >nul
            if errorlevel 1 (
              echo [WARN] Direction token not found: %%D
              >>direction-report.txt echo MISS %%D
            ) else (
              echo [PASS] Direction token: %%D
              >>direction-report.txt echo PASS %%D
              set /a PASSCOUNT+=1
            )
          )

          echo [INFO] Long-name direction matches=!PASSCOUNT!/8
          >>direction-report.txt echo LONG_NAME_MATCHES !PASSCOUNT!/8

          if !PASSCOUNT! LSS 8 (
            echo [INFO] Long names are incomplete. Checking short direction tokens as secondary evidence.
            set "SHORTCOUNT=0"
            for %%D in (n ne e se s sw w nw) do (
              findstr /R /I /C:"[\\/_ -]%%D[\\/_ .-]" mage-filelist.txt >nul
              if not errorlevel 1 set /a SHORTCOUNT+=1
            )
            echo [INFO] Short-token direction matches=!SHORTCOUNT!/8
            >>direction-report.txt echo SHORT_TOKEN_MATCHES !SHORTCOUNT!/8
          )

          echo [INFO] File naming alone may not prove row order for atlas/sheet assets.
          echo [INFO] Next stage will inspect manifest/metadata or generate a visual contact sheet when needed.

      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pico-heroes-folder-inspection
          path: |
            asset-root.txt
            asset-filelist.txt
            mage-filelist.txt
            state-report.txt
            direction-report.txt
          if-no-files-found: warn
          retention-days: 3
