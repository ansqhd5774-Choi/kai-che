name: 2D Asset Probe

on:
  push:
    branches:
      - feature/2d-reboot-r1
    paths:
      - ".github/workflows/2d-asset-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download public asset endpoint
        shell: cmd
        run: |
          @echo off
          curl.exe -L --fail --silent --show-error "https://demo.madeby2d.com/downloads/pico-heroes-sprite-pack.2/download-check?version_id=5&file_id=5" -o pico-heroes-download.bin
          if errorlevel 1 exit /b 20
          for %%A in (pico-heroes-download.bin) do echo [INFO] bytes=%%~zA

      - name: Upload payload
        uses: actions/upload-artifact@v4
        with:
          name: pico-heroes-probe
          path: pico-heroes-download.bin
          if-no-files-found: error
          retention-days: 3
