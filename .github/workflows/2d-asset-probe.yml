name: 2D Local Asset Import Probe

on:
  push:
    branches:
      - feature/2d-reboot-r1
    paths:
      - ".github/workflows/2d-asset-probe.yml"
      - "external-assets/2d/candidates-r6/**"

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 10

    steps:
      - name: Locate registered mage archive
        shell: cmd
        run: |
          @echo off
          del /q zip-candidates.txt 2>nul
          for %%P in ("*Pico*.zip" "*Hero*.zip" "*Sprite*.zip" "*Mage*.zip" "*Wizard*.zip") do (
            for /f "delims=" %%F in ('dir /s /b "C:\actions-runner-kaise\local-assets\%%~P" 2^>nul') do echo %%F>>zip-candidates.txt
            for /f "delims=" %%F in ('dir /s /b "C:\Users\*\Downloads\%%~P" 2^>nul') do echo %%F>>zip-candidates.txt
          )
          if not exist zip-candidates.txt (
            echo [ERROR] No likely asset ZIP found in local-assets or Downloads.
            exit /b 20
          )
          type zip-candidates.txt

      - name: Find archive containing Mage files
        shell: cmd
        run: |
          @echo off
          setlocal EnableDelayedExpansion
          set "FOUND="
          for /f "usebackq delims=" %%F in ("zip-candidates.txt") do (
            if not defined FOUND (
              if exist AssetProbe rmdir /s /q AssetProbe
              mkdir AssetProbe
              tar -xf "%%F" -C AssetProbe >nul 2>&1
              if not errorlevel 1 (
                dir /s /b AssetProbe > current-filelist.txt
                findstr /I /C:"mage" current-filelist.txt >nul
                if not errorlevel 1 set "FOUND=%%F"
              )
            )
          )
          if not defined FOUND (
            echo [ERROR] Candidate ZIPs found, but none contains files with Mage in their path.
            exit /b 22
          )
          echo !FOUND!>asset-path.txt
          echo [PASS] Selected archive: !FOUND!

      - name: Inspect selected archive
        shell: cmd
        run: |
          @echo off
          set /p FOUND=<asset-path.txt
          if exist AssetProbe rmdir /s /q AssetProbe
          mkdir AssetProbe
          tar -xf "%FOUND%" -C AssetProbe
          if errorlevel 1 exit /b 21
          dir /s /b AssetProbe > asset-filelist.txt
          findstr /I /C:"mage" asset-filelist.txt > mage-filelist.txt
          if errorlevel 1 exit /b 22
          echo [PASS] Mage files found.

      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pico-heroes-local-inspection
          path: |
            zip-candidates.txt
            asset-path.txt
            asset-filelist.txt
            mage-filelist.txt
          if-no-files-found: warn
          retention-days: 3
