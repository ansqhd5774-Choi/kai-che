name: 2D Local Asset Import Probe

on:
  push:
    branches:
      - feature/2d-reboot-r1
    paths:
      - ".github/workflows/2d-asset-probe.yml"
      - "external-assets/2d/candidates-r6/**"

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 10

    steps:
      - name: Locate registered mage archive
        shell: cmd
        run: |
          @echo off
          set "FOUND="
          if exist "C:\actions-runner-kaise\local-assets\PicoHeroes.zip" set "FOUND=C:\actions-runner-kaise\local-assets\PicoHeroes.zip"
          if not defined FOUND (
            for /f "delims=" %%F in ('dir /s /b "C:\actions-runner-kaise\*Pico*.zip" 2^>nul') do if not defined FOUND set "FOUND=%%F"
          )
          if not defined FOUND (
            for /f "delims=" %%F in ('dir /s /b "C:\Users\*\Downloads\*Pico*.zip" 2^>nul') do if not defined FOUND set "FOUND=%%F"
          )
          if not defined FOUND (
            echo [ERROR] No Pico*.zip archive found under runner or user Downloads.
            exit /b 20
          )
          echo [PASS] Found archive: %FOUND%
          echo %FOUND%>asset-path.txt
          for %%A in ("%FOUND%") do echo [PASS] bytes=%%~zA

      - name: Inspect archive contents
        shell: cmd
        run: |
          @echo off
          set /p FOUND=<asset-path.txt
          if exist AssetProbe rmdir /s /q AssetProbe
          mkdir AssetProbe
          tar -xf "%FOUND%" -C AssetProbe
          if errorlevel 1 exit /b 21
          dir /s /b AssetProbe > asset-filelist.txt
          findstr /I /C:"mage" asset-filelist.txt > mage-filelist.txt
          if errorlevel 1 (
            echo [ERROR] Mage files were not found in archive.
            exit /b 22
          )
          echo [PASS] Mage files found.

      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pico-heroes-local-inspection
          path: |
            asset-path.txt
            asset-filelist.txt
            mage-filelist.txt
          if-no-files-found: warn
          retention-days: 3
