name: Dispatch KaiChe Device Verify Once

on:
  push:
    branches:
      - feature/35-libs-integration-r1
    paths:
      - .github/workflows/device-verify-feature-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-device-verify:
    name: Verify staged APK SHA and dispatch device regression
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 5
    env:
      APK_SHA_PATH: C:\actions-runner-kaise\local-builds\KaiChe-dev.sha
      EXPECTED_APK_SHA: dd6c7c16a0931cbaec30f235073242562d56220e
      TARGET_REF: feature/35-libs-integration-r1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify staged APK source and dispatch existing device workflow
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          if not exist "%APK_SHA_PATH%" (
            echo [ERROR] APK source SHA file not found: %APK_SHA_PATH%
            exit /b 20
          )
          set /p ACTUAL_SHA=<"%APK_SHA_PATH%"
          if /I not "!ACTUAL_SHA!"=="%EXPECTED_APK_SHA%" (
            echo [ERROR] Staged APK source SHA mismatch. expected=%EXPECTED_APK_SHA% actual=!ACTUAL_SHA!
            exit /b 21
          )
          echo [PASS] Staged APK source SHA verified: !ACTUAL_SHA!
          curl.exe -L --fail-with-body -X POST ^
            -H "Accept: application/vnd.github+json" ^
            -H "Authorization: Bearer %GH_TOKEN%" ^
            -H "X-GitHub-Api-Version: 2022-11-28" ^
            "https://api.github.com/repos/%GITHUB_REPOSITORY%/actions/workflows/android-device-install.yml/dispatches" ^
            -d "{\"ref\":\"%TARGET_REF%\"}"
          if errorlevel 1 exit /b 22
          echo [PASS] Device verification workflow dispatched for %TARGET_REF%.
