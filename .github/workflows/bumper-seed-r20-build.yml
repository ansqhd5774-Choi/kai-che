name: Bumper Seed R20 Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/r20-impact-feedback
    paths:
      - "Assets/_Project/Prototypes/BumperSeed/**"
      - "Assets/_Project/Editor/BumperSeedR20PrototypeBuild.cs"
      - "docs/BUMPER_SEED_R20_FEEDBACK_GATE.md"
      - ".github/workflows/bumper-seed-r20-build.yml"

concurrency:
  group: bumper-seed-r20-selfhosted
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build Bumper Seed R20 APK
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 60
    env:
      UNITY_EXE: C:\\Program Files\\Unity\\Hub\\Editor\\6000.6.4f1\\Editor\\Unity.exe
      LOCAL_APK_DIR: C:\\actions-runner-kaise\\local-builds
      ADB_EXE: C:\Program Files\Unity\Hub\Editor\6000.6.4f1\Editor\Data\PlaybackEngines\AndroidPlayer\SDK\platform-tools\adb.exe
      APK_PATH: C:\actions-runner-kaise\local-builds\BumperSeed-R20.apk
      APK_SHA_PATH: C:\actions-runner-kaise\local-builds\BumperSeed-R20.sha
      PACKAGE_ID: com.kaiche.bumperseed
      ADB_MDNS: 1
      ADB_MDNS_OPENSCREEN: 0

    steps:
      - name: Ensure Git is on PATH
        shell: cmd
        run: |
          @echo off
          if not exist "C:\\Program Files\\Git\\cmd\\git.exe" exit /b 22
          echo C:\\Program Files\\Git\\cmd>>"%GITHUB_PATH%"
          echo C:\\Program Files\\Git\\bin>>"%GITHUB_PATH%"
          "C:\\Program Files\\Git\\cmd\\git.exe" --version

      - name: Checkout R20 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          clean: false

      - name: Verify Unity host
        shell: cmd
        run: |
          @echo off
          if not exist "%UNITY_EXE%" exit /b 20
          "%UNITY_EXE%" -version
          if errorlevel 1 exit /b 21
          tasklist | findstr /I /C:"Unity Hub.exe" /C:"Unity.Licensing.Client.exe" /C:"Unity.exe" || echo [WARN] Unity/Hub licensing processes are not visible before build.
          findstr /C:"m_EditorVersion: 6000.6.4f1" ProjectSettings\\ProjectVersion.txt >nul
          if errorlevel 1 exit /b 30
          echo [PASS] Unity 6000.6.4f1 verified.

      - name: Build Bumper Seed R20 APK
        shell: cmd
        timeout-minutes: 25
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          if not exist Logs mkdir Logs
          del /q "Logs\\bumper-seed-r20-build.log" "Logs\\bumper-seed-r20-exit.txt" 2>nul
          if exist "Builds\\Android\\BumperSeed-R20.apk" del /q "Builds\\Android\\BumperSeed-R20.apk"

          set "UNITY_RUNNER=%GITHUB_WORKSPACE%\\Logs\\run-bumper-seed-r20-build.cmd"
          >"%UNITY_RUNNER%" echo @echo off
          >>"%UNITY_RUNNER%" echo "%UNITY_EXE%" -batchmode -nographics -quit -stackTraceLogType Full -projectPath "%GITHUB_WORKSPACE%" -buildTarget Android -executeMethod KaiChe.EditorTools.BumperSeedR20PrototypeBuild.BuildR20AndroidApk -logFile "%GITHUB_WORKSPACE%\\Logs\\bumper-seed-r20-build.log"
          >>"%UNITY_RUNNER%" echo set "UNITY_RC=%%ERRORLEVEL%%"
          >>"%UNITY_RUNNER%" echo ^>"%GITHUB_WORKSPACE%\\Logs\\bumper-seed-r20-exit.txt" echo %%UNITY_RC%%
          >>"%UNITY_RUNNER%" echo exit /b %%UNITY_RC%%

          start "" /b cmd /d /c call "%UNITY_RUNNER%"

          :monitor
          if exist "Logs\\bumper-seed-r20-exit.txt" goto finished
          if exist "Logs\\bumper-seed-r20-build.log" (
            for %%A in ("Logs\\bumper-seed-r20-build.log") do set "SIZE=%%~zA"
            echo [HEARTBEAT] %TIME% bumper_seed_r20_log_bytes=!SIZE!
          ) else (
            echo [HEARTBEAT] %TIME% waiting_for_unity_log
          )
          ping -n 31 127.0.0.1 >nul
          goto monitor

          :finished
          set "RC="
          set /p RC=<"Logs\\bumper-seed-r20-exit.txt"
          if exist "Logs\\bumper-seed-r20-build.log" type "Logs\\bumper-seed-r20-build.log"
          if not defined RC exit /b 43
          if not "!RC!"=="0" exit /b !RC!
          if not exist "Builds\\Android\\BumperSeed-R20.apk" exit /b 40
          echo [PASS] Bumper Seed R20 APK created.

      - name: Persist APK on runner
        if: success()
        shell: cmd
        run: |
          @echo off
          if not exist "%LOCAL_APK_DIR%" mkdir "%LOCAL_APK_DIR%"
          copy /Y "Builds\\Android\\BumperSeed-R20.apk" "%LOCAL_APK_DIR%\\BumperSeed-R20.apk"
          if errorlevel 1 exit /b 41
          >"%LOCAL_APK_DIR%\\BumperSeed-R20.sha" echo %GITHUB_SHA%
          echo [PASS] Bumper Seed R20 APK persisted.

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BumperSeed-R20-${{ github.sha }}
          path: Builds/Android/BumperSeed-R20.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BumperSeed-R20-Log-${{ github.sha }}
          path: Logs/bumper-seed-r20-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify local R20 APK for device smoke
        if: success()
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          if not exist "%ADB_EXE%" exit /b 20
          if not exist "%APK_PATH%" exit /b 21
          if not exist "%APK_SHA_PATH%" exit /b 22
          set /p APK_SHA=<"%APK_SHA_PATH%"
          if /I not "%APK_SHA%"=="%GITHUB_SHA%" exit /b 23
          for %%A in ("%APK_PATH%") do echo [PASS] R20 APK: %%~fA (%%~zA bytes)

      - name: Recover paired Android device
        if: success()
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          del /q Logs\bumper-r20-adb*.txt 2>nul
          "%ADB_EXE%" devices -l > Logs\bumper-r20-adb-before.txt 2>&1
          "%ADB_EXE%" get-state >nul 2>&1
          if not errorlevel 1 goto device_ready

          "%ADB_EXE%" mdns services > Logs\bumper-r20-adb-mdns.txt 2>&1
          for /f "tokens=1,2,3,4" %%A in ('findstr /C:"_adb-tls-connect._tcp" Logs\bumper-r20-adb-mdns.txt') do (
            set "ENDPOINT="
            if "%%B"=="_adb-tls-connect._tcp" set "ENDPOINT=%%C"
            if "%%C"=="_adb-tls-connect._tcp" set "ENDPOINT=%%D"
            if defined ENDPOINT (
              "%ADB_EXE%" connect !ENDPOINT! > Logs\bumper-r20-adb-connect.txt 2>&1
              ping -n 3 127.0.0.1 >nul
              "%ADB_EXE%" get-state >nul 2>&1
              if not errorlevel 1 goto device_ready
            )
          )

          "%ADB_EXE%" reconnect > Logs\bumper-r20-adb-reconnect.txt 2>&1
          ping -n 4 127.0.0.1 >nul
          "%ADB_EXE%" get-state >nul 2>&1
          if errorlevel 1 (
            "%ADB_EXE%" devices -l > Logs\bumper-r20-adb-after.txt 2>&1
            echo [ERROR] No paired Android device is online.
            exit /b 30
          )

          :device_ready
          "%ADB_EXE%" devices -l > Logs\bumper-r20-adb-after.txt 2>&1
          echo [PASS] Android device online.

      - name: Install isolated Bumper Seed package
        if: success()
        shell: cmd
        run: |
          @echo off
          "%ADB_EXE%" install -r "%APK_PATH%"
          if errorlevel 1 exit /b 40
          "%ADB_EXE%" shell pm path %PACKAGE_ID% > Logs\bumper-r20-package-path.txt 2>&1
          if errorlevel 1 exit /b 41
          echo [PASS] Bumper Seed R20 installed without replacing KaiChe RPG.

      - name: Launch and verify R20 runtime
        if: success()
        shell: cmd
        run: |
          @echo off
          "%ADB_EXE%" shell am force-stop %PACKAGE_ID% >nul 2>&1
          "%ADB_EXE%" logcat -c
          "%ADB_EXE%" shell monkey -p %PACKAGE_ID% -c android.intent.category.LAUNCHER 1 > Logs\bumper-r20-launch.txt 2>&1
          if errorlevel 1 exit /b 50
          ping -n 7 127.0.0.1 >nul

          "%ADB_EXE%" shell pidof %PACKAGE_ID% > Logs\bumper-r20-pid.txt 2>&1
          set /p APP_PID=<Logs\bumper-r20-pid.txt
          if "%APP_PID%"=="" exit /b 51

          "%ADB_EXE%" logcat -d -t 4000 > Logs\bumper-r20-logcat.txt 2>&1
          "%ADB_EXE%" exec-out screencap -p > Logs\bumper-r20-screen.png 2>nul
          if not exist Logs\bumper-r20-screen.png exit /b 53

          findstr /C:"BUMPER_SEED_R19_CORE_ACTIVE" Logs\bumper-r20-logcat.txt >nul
          if errorlevel 1 exit /b 52
          findstr /C:"BUMPER_SEED_R20_FEEDBACK_ACTIVE" Logs\bumper-r20-logcat.txt >nul
          if errorlevel 1 exit /b 54

          echo [PASS] Bumper Seed R20 launched. PID=%APP_PID%
          echo [PASS] R19 core + R20 feedback markers found.

      - name: Upload device smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BumperSeed-R20-Device-Smoke-${{ github.sha }}
          path: |
            Logs/bumper-r20-*.txt
            Logs/bumper-r20-*.png
          if-no-files-found: warn
          retention-days: 14

