name: KaiChe Core Runtime Gates Once

on:
  push:
    branches:
      - feature/35-libs-integration-r1
    paths:
      - .github/workflows/core-runtime-gates-once.yml

permissions:
  contents: read

jobs:
  verify-core-runtime-gates:
    name: Verify shooting XP level-up 3-choice and boss loop
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 12
    env:
      ADB_EXE: C:\Program Files\Unity\Hub\Editor\6000.6.4f1\Editor\Data\PlaybackEngines\AndroidPlayer\SDK\platform-tools\adb.exe
      APK_PATH: C:\actions-runner-kaise\local-builds\KaiChe-dev.apk
      APK_SHA_PATH: C:\actions-runner-kaise\local-builds\KaiChe-dev.sha
      EXPECTED_APK_SHA: dd6c7c16a0931cbaec30f235073242562d56220e
      PACKAGE_ID: com.kaiche.rpg
      PREFS_FILE: shared_prefs/com.kaiche.rpg.v2.playerprefs.xml

    steps:
      - name: Verify exact staged APK and device
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          if not exist Logs mkdir Logs
          if not exist "%ADB_EXE%" exit /b 20
          if not exist "%APK_PATH%" exit /b 21
          if not exist "%APK_SHA_PATH%" exit /b 22
          set /p ACTUAL_SHA=<"%APK_SHA_PATH%"
          if /I not "!ACTUAL_SHA!"=="%EXPECTED_APK_SHA%" (
            echo [ERROR] APK source SHA mismatch. expected=%EXPECTED_APK_SHA% actual=!ACTUAL_SHA!
            exit /b 23
          )
          "%ADB_EXE%" get-state >nul 2>&1
          if errorlevel 1 exit /b 24
          echo [PASS] Exact staged APK and Android device verified.

      - name: Install APK and back up original PlayerPrefs
        shell: cmd
        run: |
          @echo off
          "%ADB_EXE%" install -r "%APK_PATH%"
          if errorlevel 1 exit /b 30
          "%ADB_EXE%" shell am force-stop %PACKAGE_ID% >nul 2>&1
          ping -n 2 127.0.0.1 >nul
          "%ADB_EXE%" shell run-as %PACKAGE_ID% cat %PREFS_FILE% > Logs\r35-gates-prefs-original.xml 2>&1
          if errorlevel 1 exit /b 31
          >Logs\r35-gates-backup.sh echo cp %PREFS_FILE% files/r35-gates-prefs-backup.xml
          type Logs\r35-gates-backup.sh | "%ADB_EXE%" shell run-as %PACKAGE_ID% sh
          if errorlevel 1 exit /b 32
          >Logs\r35-gates-backup-created.flag echo created
          echo [PASS] Original PlayerPrefs backed up.

      - name: Seed deterministic near-level-up state
        shell: cmd
        run: |
          @echo off
          >Logs\r35-gates-seed.sh echo sed -i 's/name="KaiChe.PrototypeProgression.Level" value="[^"]*"/name="KaiChe.PrototypeProgression.Level" value="132"/' %PREFS_FILE%
          >>Logs\r35-gates-seed.sh echo sed -i 's#^ *^<string name="KaiChe.PrototypeProgression.LevelExperience"^>[^<]*^</string^>#    ^<string name="KaiChe.PrototypeProgression.LevelExperience"^>397^</string^>#' %PREFS_FILE%
          >>Logs\r35-gates-seed.sh echo sed -i 's/name="KaiChe.PrototypeProgression.UnspentAttributePoints" value="[^"]*"/name="KaiChe.PrototypeProgression.UnspentAttributePoints" value="0"/' %PREFS_FILE%
          >>Logs\r35-gates-seed.sh echo sed -i 's/name="KaiChe.PrototypeProgression.PendingSkillChoices" value="[^"]*"/name="KaiChe.PrototypeProgression.PendingSkillChoices" value="0"/' %PREFS_FILE%
          >>Logs\r35-gates-seed.sh echo sed -i 's/name="KaiChe.PrototypeProgression.PendingBossRewards" value="[^"]*"/name="KaiChe.PrototypeProgression.PendingBossRewards" value="0"/' %PREFS_FILE%
          >>Logs\r35-gates-seed.sh echo sed -i 's/name="KaiChe.Adventure.Health" value="[^"]*"/name="KaiChe.Adventure.Health" value="999999"/' %PREFS_FILE%
          type Logs\r35-gates-seed.sh | "%ADB_EXE%" shell run-as %PACKAGE_ID% sh
          if errorlevel 1 exit /b 40
          "%ADB_EXE%" shell run-as %PACKAGE_ID% cat %PREFS_FILE% > Logs\r35-gates-prefs-seeded.xml 2>&1
          findstr /R /C:"LevelExperience.*397" Logs\r35-gates-prefs-seeded.xml >nul 2>&1
          if errorlevel 1 (
            echo [ERROR] Near-level-up seed was not applied.
            exit /b 41
          )
          echo [PASS] Deterministic level 132 / 397 XP state seeded.

      - name: Verify shooting XP level-up and three-choice generation
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          "%ADB_EXE%" logcat -c
          "%ADB_EXE%" shell monkey -p %PACKAGE_ID% -c android.intent.category.LAUNCHER 1 >nul 2>&1
          ping -n 5 127.0.0.1 >nul
          "%ADB_EXE%" shell input tap 720 1840
          ping -n 12 127.0.0.1 >nul
          "%ADB_EXE%" logcat -d -t 12000 > Logs\r35-core-gates-level-logcat.txt 2>&1

          findstr /C:"KAI_CHE_FIREBALL_FIRST_SHOT" Logs\r35-core-gates-level-logcat.txt >nul 2>&1
          if errorlevel 1 exit /b 50
          findstr /C:"KAI_CHE_LEVEL_POWER_133_" Logs\r35-core-gates-level-logcat.txt >nul 2>&1
          if errorlevel 1 (
            echo [ERROR] XP did not produce the expected level-up.
            exit /b 51
          )
          findstr /C:"KAI_CHE_SKILL_CHOICE_READY" Logs\r35-core-gates-level-logcat.txt >nul 2>&1
          if errorlevel 1 exit /b 52
          findstr /R /C:"KAI_CHE_R23_CHOICES_.*|.*|.*" Logs\r35-core-gates-level-logcat.txt >nul 2>&1
          if errorlevel 1 (
            echo [ERROR] Three-choice skill generation marker missing.
            exit /b 53
          )
          echo [PASS] Shooting, XP, level-up and three-choice generation verified.

          rem Clear the level-up choice and all three prototype attribute points.
          for /L %%I in (1,1,12) do (
            "%ADB_EXE%" shell input tap 300 1430
            ping -n 2 127.0.0.1 >nul
          )
          "%ADB_EXE%" shell run-as %PACKAGE_ID% cat %PREFS_FILE% > Logs\r35-gates-after-level-choice.xml 2>&1
          findstr /R /C:"UnspentAttributePoints.*value=.0." Logs\r35-gates-after-level-choice.xml >nul 2>&1
          if errorlevel 1 exit /b 54
          findstr /R /C:"PendingSkillChoices.*value=.0." Logs\r35-gates-after-level-choice.xml >nul 2>&1
          if errorlevel 1 exit /b 55
          echo [PASS] Level-up modal and skill choice resolved; combat resumed.

      - name: Verify boss spawn defeat and reward loop
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set "BOSS_SPAWNED=0"
          for /L %%I in (1,1,55) do (
            "%ADB_EXE%" logcat -d -t 20000 > Logs\r35-core-gates-boss-logcat.txt 2>&1
            findstr /C:"KAI_CHE_BOSS_SPAWN_FIRST" Logs\r35-core-gates-boss-logcat.txt >nul 2>&1
            if not errorlevel 1 set "BOSS_SPAWNED=1"
            findstr /C:"KAI_CHE_BOSS_DEFEATED_FIRST" Logs\r35-core-gates-boss-logcat.txt >nul 2>&1
            if not errorlevel 1 goto boss_defeated
            ping -n 4 127.0.0.1 >nul
          )
          echo [ERROR] Boss was not defeated inside the runtime gate window. spawned=!BOSS_SPAWNED!
          exit /b 60

          :boss_defeated
          if not "!BOSS_SPAWNED!"=="1" (
            echo [ERROR] Boss defeat was seen without boss spawn evidence.
            exit /b 61
          )
          findstr /C:"KAI_CHE_BOSS_DEFEATED_WAVE_3" Logs\r35-core-gates-boss-logcat.txt >nul 2>&1
          if errorlevel 1 exit /b 62
          "%ADB_EXE%" shell run-as %PACKAGE_ID% cat %PREFS_FILE% > Logs\r35-gates-after-boss.xml 2>&1
          findstr /R /C:"PendingBossRewards.*value=.[1-9]" Logs\r35-gates-after-boss.xml >nul 2>&1
          if errorlevel 1 (
            echo [ERROR] Boss defeat did not persist a pending boss reward.
            exit /b 63
          )
          echo [PASS] Boss wave 3 spawn, defeat and reward persistence verified.

      - name: Capture core gate evidence
        if: always()
        shell: cmd
        run: |
          @echo off
          if not exist Logs mkdir Logs
          "%ADB_EXE%" exec-out screencap -p > Logs\r35-core-gates-screen.png 2>nul
          "%ADB_EXE%" logcat -d -t 20000 > Logs\r35-core-gates-final-logcat.txt 2>&1

      - name: Restore original PlayerPrefs byte-for-byte
        if: always()
        shell: cmd
        run: |
          @echo off
          if not exist Logs\r35-gates-backup-created.flag exit /b 0
          "%ADB_EXE%" shell am force-stop %PACKAGE_ID% >nul 2>&1
          >Logs\r35-gates-restore.sh echo cp files/r35-gates-prefs-backup.xml %PREFS_FILE%
          >>Logs\r35-gates-restore.sh echo rm -f files/r35-gates-prefs-backup.xml
          type Logs\r35-gates-restore.sh | "%ADB_EXE%" shell run-as %PACKAGE_ID% sh
          if errorlevel 1 exit /b 70
          "%ADB_EXE%" shell run-as %PACKAGE_ID% cat %PREFS_FILE% > Logs\r35-gates-prefs-restored.xml 2>&1
          fc /b Logs\r35-gates-prefs-original.xml Logs\r35-gates-prefs-restored.xml > Logs\r35-gates-restore-compare.txt 2>&1
          if errorlevel 1 (
            echo [ERROR] Original PlayerPrefs byte-for-byte restore failed.
            exit /b 71
          )
          "%ADB_EXE%" shell monkey -p %PACKAGE_ID% -c android.intent.category.LAUNCHER 1 >nul 2>&1
          echo [PASS] Original PlayerPrefs restored byte-for-byte.

      - name: Upload core runtime gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaiChe-R35-Core-Runtime-Gates
          path: |
            Logs/r35-gates-prefs-original.xml
            Logs/r35-gates-prefs-seeded.xml
            Logs/r35-core-gates-level-logcat.txt
            Logs/r35-gates-after-level-choice.xml
            Logs/r35-core-gates-boss-logcat.txt
            Logs/r35-gates-after-boss.xml
            Logs/r35-core-gates-final-logcat.txt
            Logs/r35-core-gates-screen.png
            Logs/r35-gates-prefs-restored.xml
            Logs/r35-gates-restore-compare.txt
          if-no-files-found: warn
          retention-days: 7
