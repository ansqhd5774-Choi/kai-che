name: Cancel Stuck KAISE Build

on:
  push:
    branches:
      - upgrade/unity-6000.6.4f1
    paths:
      - ".github/workflows/cancel-stuck-kaise-build.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$GH_REPO/actions/runs/37289401313/cancel"
