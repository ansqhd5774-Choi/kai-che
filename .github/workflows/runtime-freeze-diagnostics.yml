name: KaiChe Runtime Freeze Diagnostics

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/runtime-freeze-diagnostics.yml"

concurrency:
  group: kaise-runtime-freeze-diagnostics
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    name: Capture live Android runtime state
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 5
    env:
      ADB_EXE: C:\Program Files\Unity\Hub\Editor\6000.6.4f1\Editor\Data\PlaybackEngines\AndroidPlayer\SDK\platform-tools\adb.exe
      PACKAGE_ID: com.kaiche.rpg
      ADB_MDNS: 1
      ADB_MDNS_OPENSCREEN: 0

    steps:
      - name: Connect to current Android device without restarting app
        shell: cmd
        run: |
          @echo off
          if not exist Logs mkdir Logs
          if not exist "%ADB_EXE%" exit /b 20
          "%ADB_EXE%" start-server >nul 2>&1
          "%ADB_EXE%" devices -l > Logs\diag-devices-before.txt 2>&1
          "%ADB_EXE%" get-state >nul 2>&1
          if not errorlevel 1 goto connected
          "%ADB_EXE%" mdns services > Logs\diag-mdns.txt 2>&1
          for /f "tokens=3" %%E in ('findstr /C:"_adb-tls-connect._tcp" Logs\diag-mdns.txt') do (
            "%ADB_EXE%" connect %%E >> Logs\diag-connect.txt 2>&1
            ping -n 2 127.0.0.1 >nul
            "%ADB_EXE%" get-state >nul 2>&1
            if not errorlevel 1 goto connected
          )
          echo [ERROR] No Android device connected.
          type Logs\diag-mdns.txt
          type Logs\diag-connect.txt
          exit /b 30
          :connected
          "%ADB_EXE%" devices -l > Logs\diag-devices-after.txt 2>&1
          echo [PASS] Android device connected.

      - name: Capture frozen app state
        shell: cmd
        run: |
          @echo off
          "%ADB_EXE%" shell pidof %PACKAGE_ID% > Logs\diag-pid.txt 2>&1
          "%ADB_EXE%" shell dumpsys activity top > Logs\diag-activity-top.txt 2>&1
          "%ADB_EXE%" shell dumpsys activity activities > Logs\diag-activities.txt 2>&1
          "%ADB_EXE%" shell dumpsys activity processes > Logs\diag-processes.txt 2>&1
          "%ADB_EXE%" shell dumpsys activity exit-info %PACKAGE_ID% > Logs\diag-exit-info.txt 2>&1
          "%ADB_EXE%" shell dumpsys meminfo %PACKAGE_ID% > Logs\diag-meminfo.txt 2>&1
          "%ADB_EXE%" shell dumpsys gfxinfo %PACKAGE_ID% > Logs\diag-gfxinfo.txt 2>&1
          "%ADB_EXE%" logcat -d -v threadtime -t 1200 > Logs\diag-logcat.txt 2>&1
          "%ADB_EXE%" exec-out screencap -p > Logs\diag-screen.png 2>nul
          type Logs\diag-pid.txt

      - name: Print critical runtime lines
        shell: cmd
        run: |
          @echo off
          echo ===== PID =====
          type Logs\diag-pid.txt
          echo ===== CRITICAL LOGCAT =====
          findstr /I /C:"FATAL EXCEPTION" /C:"ANR" /C:"Application Not Responding" /C:"Input dispatching timed out" /C:"AndroidRuntime" /C:"Unity" /C:"SIGSEGV" /C:"CRASH" /C:"OutOfMemory" Logs\diag-logcat.txt
          exit /b 0

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaiChe-Runtime-Freeze-Diagnostics
          path: |
            Logs/diag-devices-before.txt
            Logs/diag-devices-after.txt
            Logs/diag-mdns.txt
            Logs/diag-connect.txt
            Logs/diag-pid.txt
            Logs/diag-activity-top.txt
            Logs/diag-activities.txt
            Logs/diag-processes.txt
            Logs/diag-exit-info.txt
            Logs/diag-meminfo.txt
            Logs/diag-gfxinfo.txt
            Logs/diag-logcat.txt
            Logs/diag-screen.png
          if-no-files-found: warn
          retention-days: 3
