name: 2D Local Asset Discovery

on:
  push:
    branches:
      - feature/2d-8dir-r1
    paths:
      - ".github/workflows/2d-asset-discovery.yml"
  workflow_dispatch:

concurrency:
  group: kaise-2d-asset-discovery
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover-assets:
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 10

    steps:
      - name: Scan local folders and ZIP indexes
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          if not exist Logs mkdir Logs
          del /q Logs\2d-assets-*.txt 2>nul

          set "ROOT1=C:\actions-runner-kaise\local-assets"
          set "ROOT2=%USERPROFILE%\Downloads"
          set "ROOT3=%USERPROFILE%\Desktop"

          > Logs\2d-assets-roots.txt echo ROOT1=!ROOT1!
          >>Logs\2d-assets-roots.txt echo ROOT2=!ROOT2!
          >>Logs\2d-assets-roots.txt echo ROOT3=!ROOT3!

          for %%R in ("!ROOT1!" "!ROOT2!" "!ROOT3!") do (
            if exist "%%~R" (
              echo [SCAN] %%~R
              dir /s /b "%%~R\*.zip" 2>nul >> Logs\2d-assets-zips.txt
              dir /s /b "%%~R\*.png" 2>nul >> Logs\2d-assets-pngs.txt
              dir /s /b "%%~R\*.jpg" 2>nul >> Logs\2d-assets-images.txt
              dir /s /b "%%~R\*.jpeg" 2>nul >> Logs\2d-assets-images.txt
            )
          )

          if not exist Logs\2d-assets-zips.txt type nul > Logs\2d-assets-zips.txt
          if not exist Logs\2d-assets-pngs.txt type nul > Logs\2d-assets-pngs.txt
          if not exist Logs\2d-assets-images.txt type nul > Logs\2d-assets-images.txt

          echo ===== LOOSE PNG CANDIDATES ===== > Logs\2d-assets-candidates.txt
          findstr /I /C:"idle" /C:"walk" /C:"run" /C:"attack" /C:"shoot" /C:"fire" /C:"hit" /C:"hurt" /C:"death" /C:"die" /C:"character" /C:"hero" /C:"sprite" Logs\2d-assets-pngs.txt >> Logs\2d-assets-candidates.txt

          where tar >nul 2>&1
          if errorlevel 1 (
            echo [WARN] tar.exe unavailable; ZIP contents could not be indexed.>>Logs\2d-assets-candidates.txt
          ) else (
            for /f "usebackq delims=" %%Z in ("Logs\2d-assets-zips.txt") do (
              echo ===== ZIP: %%Z ===== >> Logs\2d-assets-zip-index.txt
              tar -tf "%%Z" >> Logs\2d-assets-zip-index.txt 2>nul
              echo ===== ZIP CANDIDATES: %%Z ===== >> Logs\2d-assets-candidates.txt
              tar -tf "%%Z" 2>nul | findstr /I /C:"idle" /C:"walk" /C:"run" /C:"attack" /C:"shoot" /C:"fire" /C:"hit" /C:"hurt" /C:"death" /C:"die" /C:"character" /C:"hero" /C:"sprite" >> Logs\2d-assets-candidates.txt
            )
          )

          if not exist Logs\2d-assets-zip-index.txt type nul > Logs\2d-assets-zip-index.txt

          set /a ZIP_COUNT=0
          for /f %%C in ('find /c /v "" ^< Logs\2d-assets-zips.txt') do set /a ZIP_COUNT=%%C
          set /a PNG_COUNT=0
          for /f %%C in ('find /c /v "" ^< Logs\2d-assets-pngs.txt') do set /a PNG_COUNT=%%C
          set /a CANDIDATE_LINES=0
          for /f %%C in ('find /c /v "" ^< Logs\2d-assets-candidates.txt') do set /a CANDIDATE_LINES=%%C

          > Logs\2d-assets-summary.txt echo ZIP_COUNT=!ZIP_COUNT!
          >>Logs\2d-assets-summary.txt echo PNG_COUNT=!PNG_COUNT!
          >>Logs\2d-assets-summary.txt echo CANDIDATE_LINES=!CANDIDATE_LINES!

          if !CANDIDATE_LINES! GTR 1 (
            echo ASSET_RESULT=CANDIDATES_FOUND>>"%GITHUB_ENV%"
            echo [PASS] Candidate sprite asset paths found. ZIP=!ZIP_COUNT! PNG=!PNG_COUNT! candidateLines=!CANDIDATE_LINES!
          ) else (
            echo ASSET_RESULT=NO_CANDIDATES>>"%GITHUB_ENV%"
            echo [WARN] No broad animation/sprite candidates found. ZIP=!ZIP_COUNT! PNG=!PNG_COUNT!
          )

      - name: Publish discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2d-assets-${{ env.ASSET_RESULT }}
          path: |
            Logs/2d-assets-roots.txt
            Logs/2d-assets-summary.txt
            Logs/2d-assets-zips.txt
            Logs/2d-assets-pngs.txt
            Logs/2d-assets-zip-index.txt
            Logs/2d-assets-candidates.txt
          if-no-files-found: warn
          retention-days: 7
