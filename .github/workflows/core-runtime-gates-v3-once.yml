name: KaiChe Core Runtime Gates V3 Once

on:
  push:
    branches:
      - feature/35-libs-integration-r1
    paths:
      - .github/workflows/core-runtime-gates-v3-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 12
    env:
      ADB_EXE: C:\Program Files\Unity\Hub\Editor\6000.6.4f1\Editor\Data\PlaybackEngines\AndroidPlayer\SDK\platform-tools\adb.exe
      APK_PATH: C:\actions-runner-kaise\local-builds\KaiChe-dev.apk
      APK_SHA_PATH: C:\actions-runner-kaise\local-builds\KaiChe-dev.sha
      EXPECTED_APK_SHA: dd6c7c16a0931cbaec30f235073242562d56220e
      PACKAGE_ID: com.kaiche.rpg
      PREFS_FILE: shared_prefs/com.kaiche.rpg.v2.playerprefs.xml

    steps:
      - name: Verify APK device install and backup
        shell: cmd
        run: |
          @echo off
          setlocal EnableDelayedExpansion
          if not exist Logs mkdir Logs
          set /p ACTUAL_SHA=<"%APK_SHA_PATH%"
          if /I not "!ACTUAL_SHA!"=="%EXPECTED_APK_SHA%" exit /b 20
          "%ADB_EXE%" get-state >nul 2>&1
          if errorlevel 1 exit /b 21
          "%ADB_EXE%" install -r "%APK_PATH%"
          if errorlevel 1 exit /b 22
          "%ADB_EXE%" shell am force-stop %PACKAGE_ID% >nul 2>&1
          "%ADB_EXE%" shell run-as %PACKAGE_ID% cat %PREFS_FILE% > Logs\r35v3-original.xml 2>&1
          if errorlevel 1 exit /b 23
          >Logs\r35v3-backup.sh echo cp %PREFS_FILE% files/r35v3-backup.xml
          type Logs\r35v3-backup.sh | "%ADB_EXE%" shell run-as %PACKAGE_ID% sh
          if errorlevel 1 exit /b 24
          >Logs\r35v3-backup.flag echo created
          echo [PASS] APK SHA device install and PlayerPrefs backup verified.

      - name: Seed low level state
        shell: cmd
        run: |
          @echo off
          >Logs\r35v3-seed-low.sh echo sed -i 's/name="KaiChe.PrototypeProgression.Level" value="[^"]*"/name="KaiChe.PrototypeProgression.Level" value="1"/' %PREFS_FILE%
          >>Logs\r35v3-seed-low.sh echo sed -i 's/name="KaiChe.PrototypeProgression.UnspentAttributePoints" value="[^"]*"/name="KaiChe.PrototypeProgression.UnspentAttributePoints" value="0"/' %PREFS_FILE%
          >>Logs\r35v3-seed-low.sh echo sed -i 's/name="KaiChe.PrototypeProgression.PendingSkillChoices" value="[^"]*"/name="KaiChe.PrototypeProgression.PendingSkillChoices" value="0"/' %PREFS_FILE%
          >>Logs\r35v3-seed-low.sh echo sed -i 's/name="KaiChe.PrototypeProgression.PendingBossRewards" value="[^"]*"/name="KaiChe.PrototypeProgression.PendingBossRewards" value="0"/' %PREFS_FILE%
          >>Logs\r35v3-seed-low.sh echo sed -i 's/name="KaiChe.Adventure.Health" value="[^"]*"/name="KaiChe.Adventure.Health" value="999999"/' %PREFS_FILE%
          type Logs\r35v3-seed-low.sh | "%ADB_EXE%" shell run-as %PACKAGE_ID% sh
          if errorlevel 1 exit /b 30
          "%ADB_EXE%" shell run-as %PACKAGE_ID% cat %PREFS_FILE% > Logs\r35v3-seeded-low.xml 2>&1
          findstr /R /C:"PrototypeProgression.Level.*value=.1." Logs\r35v3-seeded-low.xml >nul 2>&1
          if errorlevel 1 exit /b 31
          echo [PASS] Low-level deterministic state seeded.

      - name: Verify shooting XP level-up and three choices
        shell: cmd
        run: |
          @echo off
          "%ADB_EXE%" logcat -c
          "%ADB_EXE%" shell monkey -p %PACKAGE_ID% -c android.intent.category.LAUNCHER 1 >nul 2>&1
          ping -n 5 127.0.0.1 >nul
          "%ADB_EXE%" shell input tap 720 1840
          ping -n 14 127.0.0.1 >nul
          "%ADB_EXE%" logcat -d -t 14000 > Logs\r35v3-level-logcat.txt 2>&1
          findstr /C:"KAI_CHE_FIREBALL_FIRST_SHOT" Logs\r35v3-level-logcat.txt >nul 2>&1
          if errorlevel 1 exit /b 40
          findstr /C:"KAI_CHE_LEVEL_POWER_" Logs\r35v3-level-logcat.txt >nul 2>&1
          if errorlevel 1 exit /b 41
          findstr /C:"KAI_CHE_SKILL_CHOICE_READY" Logs\r35v3-level-logcat.txt >nul 2>&1
          if errorlevel 1 exit /b 42
          findstr /R /C:"KAI_CHE_R23_CHOICES_.*|.*|.*" Logs\r35v3-level-logcat.txt >nul 2>&1
          if errorlevel 1 exit /b 43
          echo [PASS] Shooting XP level-up and three-choice generation verified.
          for /L %%I in (1,1,28) do "%ADB_EXE%" shell input tap 300 1430 >nul 2>&1
          ping -n 4 127.0.0.1 >nul
          "%ADB_EXE%" shell run-as %PACKAGE_ID% cat %PREFS_FILE% > Logs\r35v3-after-choice.xml 2>&1
          findstr /R /C:"UnspentAttributePoints.*value=.0." Logs\r35v3-after-choice.xml >nul 2>&1
          if errorlevel 1 exit /b 44
          findstr /R /C:"PendingSkillChoices.*value=.0." Logs\r35v3-after-choice.xml >nul 2>&1
          if errorlevel 1 exit /b 45
          echo [PASS] Level-up choices resolved.

      - name: Seed max level for uninterrupted boss loop
        shell: cmd
        run: |
          @echo off
          "%ADB_EXE%" shell am force-stop %PACKAGE_ID% >nul 2>&1
          >Logs\r35v3-seed-max.sh echo sed -i 's/name="KaiChe.PrototypeProgression.Level" value="[^"]*"/name="KaiChe.PrototypeProgression.Level" value="9999"/' %PREFS_FILE%
          >>Logs\r35v3-seed-max.sh echo sed -i 's/name="KaiChe.PrototypeProgression.UnspentAttributePoints" value="[^"]*"/name="KaiChe.PrototypeProgression.UnspentAttributePoints" value="0"/' %PREFS_FILE%
          >>Logs\r35v3-seed-max.sh echo sed -i 's/name="KaiChe.PrototypeProgression.PendingSkillChoices" value="[^"]*"/name="KaiChe.PrototypeProgression.PendingSkillChoices" value="0"/' %PREFS_FILE%
          >>Logs\r35v3-seed-max.sh echo sed -i 's/name="KaiChe.PrototypeProgression.PendingBossRewards" value="[^"]*"/name="KaiChe.PrototypeProgression.PendingBossRewards" value="0"/' %PREFS_FILE%
          >>Logs\r35v3-seed-max.sh echo sed -i 's/name="KaiChe.Adventure.Health" value="[^"]*"/name="KaiChe.Adventure.Health" value="999999"/' %PREFS_FILE%
          type Logs\r35v3-seed-max.sh | "%ADB_EXE%" shell run-as %PACKAGE_ID% sh
          if errorlevel 1 exit /b 50
          "%ADB_EXE%" shell run-as %PACKAGE_ID% cat %PREFS_FILE% > Logs\r35v3-seeded-max.xml 2>&1
          findstr /R /C:"PrototypeProgression.Level.*value=.9999." Logs\r35v3-seeded-max.xml >nul 2>&1
          if errorlevel 1 exit /b 51
          echo [PASS] Max-level boss-test state seeded.

      - name: Verify boss spawn defeat and reward
        shell: cmd
        run: |
          @echo off
          setlocal EnableDelayedExpansion
          "%ADB_EXE%" logcat -c
          "%ADB_EXE%" shell monkey -p %PACKAGE_ID% -c android.intent.category.LAUNCHER 1 >nul 2>&1
          ping -n 5 127.0.0.1 >nul
          "%ADB_EXE%" shell input tap 720 1840
          set "BOSS_SPAWNED=0"
          for /L %%I in (1,1,55) do (
            "%ADB_EXE%" logcat -d -t 20000 > Logs\r35v3-boss-logcat.txt 2>&1
            findstr /C:"KAI_CHE_BOSS_SPAWN_FIRST" Logs\r35v3-boss-logcat.txt >nul 2>&1
            if not errorlevel 1 set "BOSS_SPAWNED=1"
            findstr /C:"KAI_CHE_BOSS_DEFEATED_FIRST" Logs\r35v3-boss-logcat.txt >nul 2>&1
            if not errorlevel 1 goto boss_done
            ping -n 4 127.0.0.1 >nul
          )
          echo [ERROR] Boss gate timed out. spawned=!BOSS_SPAWNED!
          exit /b 60
          :boss_done
          if not "!BOSS_SPAWNED!"=="1" exit /b 61
          findstr /C:"KAI_CHE_BOSS_DEFEATED_WAVE_3" Logs\r35v3-boss-logcat.txt >nul 2>&1
          if errorlevel 1 exit /b 62
          "%ADB_EXE%" shell run-as %PACKAGE_ID% cat %PREFS_FILE% > Logs\r35v3-after-boss.xml 2>&1
          findstr /R /C:"PendingBossRewards.*value=.[1-9]" Logs\r35v3-after-boss.xml >nul 2>&1
          if errorlevel 1 exit /b 63
          echo [PASS] Boss wave 3 spawn defeat and reward persistence verified.

      - name: Capture evidence
        if: always()
        shell: cmd
        run: |
          @echo off
          "%ADB_EXE%" logcat -d -t 20000 > Logs\r35v3-final-logcat.txt 2>&1
          "%ADB_EXE%" exec-out screencap -p > Logs\r35v3-screen.png 2>nul

      - name: Restore original PlayerPrefs
        if: always()
        shell: cmd
        run: |
          @echo off
          if not exist Logs\r35v3-backup.flag exit /b 0
          "%ADB_EXE%" shell am force-stop %PACKAGE_ID% >nul 2>&1
          >Logs\r35v3-restore.sh echo cp files/r35v3-backup.xml %PREFS_FILE%
          >>Logs\r35v3-restore.sh echo rm -f files/r35v3-backup.xml
          type Logs\r35v3-restore.sh | "%ADB_EXE%" shell run-as %PACKAGE_ID% sh
          "%ADB_EXE%" shell run-as %PACKAGE_ID% cat %PREFS_FILE% > Logs\r35v3-restored.xml 2>&1
          fc /b Logs\r35v3-original.xml Logs\r35v3-restored.xml > Logs\r35v3-restore-compare.txt 2>&1
          if errorlevel 1 exit /b 70
          "%ADB_EXE%" shell monkey -p %PACKAGE_ID% -c android.intent.category.LAUNCHER 1 >nul 2>&1
          echo [PASS] Original PlayerPrefs restored byte-for-byte.

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaiChe-R35-Core-Runtime-Gates-V3
          path: Logs/r35v3-*
          if-no-files-found: error
          retention-days: 7
