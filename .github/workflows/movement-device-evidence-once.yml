name: KaiChe Touch Movement Evidence Once

on:
  push:
    branches:
      - feature/35-libs-integration-r1
    paths:
      - .github/workflows/movement-device-evidence-once.yml

permissions:
  contents: read

jobs:
  movement-evidence:
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 6
    env:
      ADB_EXE: C:\Program Files\Unity\Hub\Editor\6000.6.4f1\Editor\Data\PlaybackEngines\AndroidPlayer\SDK\platform-tools\adb.exe
      APK_PATH: C:\actions-runner-kaise\local-builds\KaiChe-dev.apk
      APK_SHA_PATH: C:\actions-runner-kaise\local-builds\KaiChe-dev.sha
      EXPECTED_APK_SHA: dd6c7c16a0931cbaec30f235073242562d56220e
      PACKAGE_ID: com.kaiche.rpg
      PREFS_FILE: shared_prefs/com.kaiche.rpg.v2.playerprefs.xml

    steps:
      - name: Verify APK device and back up prefs
        shell: cmd
        run: |
          @echo off
          setlocal EnableDelayedExpansion
          if not exist Logs mkdir Logs
          set /p ACTUAL_SHA=<"%APK_SHA_PATH%"
          if /I not "!ACTUAL_SHA!"=="%EXPECTED_APK_SHA%" exit /b 20
          "%ADB_EXE%" get-state >nul 2>&1
          if errorlevel 1 exit /b 21
          "%ADB_EXE%" install -r "%APK_PATH%" >nul
          if errorlevel 1 exit /b 22
          "%ADB_EXE%" shell am force-stop %PACKAGE_ID% >nul 2>&1
          "%ADB_EXE%" shell run-as %PACKAGE_ID% cat %PREFS_FILE% > Logs\move-original.xml 2>&1
          if errorlevel 1 exit /b 23
          >Logs\move-backup.sh echo cp %PREFS_FILE% files/move-backup.xml
          type Logs\move-backup.sh | "%ADB_EXE%" shell run-as %PACKAGE_ID% sh
          if errorlevel 1 exit /b 24
          >Logs\move-backup.flag echo created
          echo [PASS] Exact APK, device and prefs backup verified.

      - name: Seed uninterrupted movement state
        shell: cmd
        run: |
          @echo off
          >Logs\move-seed.sh echo sed -i 's/name="KaiChe.PrototypeProgression.Level" value="[^"]*"/name="KaiChe.PrototypeProgression.Level" value="9999"/' %PREFS_FILE%
          >>Logs\move-seed.sh echo sed -i 's/name="KaiChe.PrototypeProgression.UnspentAttributePoints" value="[^"]*"/name="KaiChe.PrototypeProgression.UnspentAttributePoints" value="0"/' %PREFS_FILE%
          >>Logs\move-seed.sh echo sed -i 's/name="KaiChe.PrototypeProgression.PendingSkillChoices" value="[^"]*"/name="KaiChe.PrototypeProgression.PendingSkillChoices" value="0"/' %PREFS_FILE%
          >>Logs\move-seed.sh echo sed -i 's/name="KaiChe.PrototypeProgression.PendingBossRewards" value="[^"]*"/name="KaiChe.PrototypeProgression.PendingBossRewards" value="0"/' %PREFS_FILE%
          >>Logs\move-seed.sh echo sed -i 's/name="KaiChe.Adventure.Health" value="[^"]*"/name="KaiChe.Adventure.Health" value="999999"/' %PREFS_FILE%
          type Logs\move-seed.sh | "%ADB_EXE%" shell run-as %PACKAGE_ID% sh
          if errorlevel 1 exit /b 30
          echo [PASS] Uninterrupted movement state seeded.

      - name: Capture before and after upward touch movement
        shell: cmd
        run: |
          @echo off
          "%ADB_EXE%" logcat -c
          "%ADB_EXE%" shell monkey -p %PACKAGE_ID% -c android.intent.category.LAUNCHER 1 >nul 2>&1
          ping -n 5 127.0.0.1 >nul
          "%ADB_EXE%" shell input tap 720 1840
          ping -n 7 127.0.0.1 >nul
          "%ADB_EXE%" exec-out screencap -p > Logs\movement-before.png 2>nul
          "%ADB_EXE%" shell input swipe 300 2100 300 1100 2500
          ping -n 2 127.0.0.1 >nul
          "%ADB_EXE%" exec-out screencap -p > Logs\movement-after.png 2>nul
          "%ADB_EXE%" logcat -d -t 12000 > Logs\movement-logcat.txt 2>&1
          findstr /C:"KAI_CHE_TOPDOWN_SHOOTER_CAMERA_ACTIVE" Logs\movement-logcat.txt >nul 2>&1
          if errorlevel 1 exit /b 40
          echo [PASS] Touch swipe executed; before/after screenshots and camera marker captured.

      - name: Restore original prefs
        if: always()
        shell: cmd
        run: |
          @echo off
          if not exist Logs\move-backup.flag exit /b 0
          "%ADB_EXE%" shell am force-stop %PACKAGE_ID% >nul 2>&1
          >Logs\move-restore.sh echo cp files/move-backup.xml %PREFS_FILE%
          >>Logs\move-restore.sh echo rm -f files/move-backup.xml
          type Logs\move-restore.sh | "%ADB_EXE%" shell run-as %PACKAGE_ID% sh
          "%ADB_EXE%" shell run-as %PACKAGE_ID% cat %PREFS_FILE% > Logs\move-restored.xml 2>&1
          fc /b Logs\move-original.xml Logs\move-restored.xml > Logs\move-restore-compare.txt 2>&1
          if errorlevel 1 exit /b 50
          "%ADB_EXE%" shell monkey -p %PACKAGE_ID% -c android.intent.category.LAUNCHER 1 >nul 2>&1
          echo [PASS] Original PlayerPrefs restored byte-for-byte.

      - name: Upload movement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaiChe-Touch-Movement-Evidence
          path: |
            Logs/movement-before.png
            Logs/movement-after.png
            Logs/movement-logcat.txt
            Logs/move-original.xml
            Logs/move-restored.xml
            Logs/move-restore-compare.txt
          if-no-files-found: error
          retention-days: 7
