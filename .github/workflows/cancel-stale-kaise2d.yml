name: Cancel stale Kaise 2D runs

on:
  push:
    branches:
      - feature/2d-reboot-hormelz-r1
    paths:
      - ".github/workflows/cancel-stale-kaise2d.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale self-hosted runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          for RUN_ID in 37580596878 37582762022; do
            echo "Cancelling stale run $RUN_ID"
            curl -fsS -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/cancel" || true
          done
