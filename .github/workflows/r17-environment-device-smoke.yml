name: R17 Environment Device Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/r17-environment-device-smoke.yml"

concurrency:
  group: kaise-r17-environment-device-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-r17-environment:
    name: Verify R17 3D environment on Android device
    runs-on: [self-hosted, Windows, X64, kaise-unity]
    timeout-minutes: 8
    env:
      ADB_EXE: C:\Program Files\Unity\Hub\Editor\6000.6.4f1\Editor\Data\PlaybackEngines\AndroidPlayer\SDK\platform-tools\adb.exe
      PACKAGE_ID: com.kaiche.rpg
      ADB_MDNS: 1
      ADB_MDNS_OPENSCREEN: 0

    steps:
      - name: Verify Android device
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          if not exist Logs mkdir Logs
          if not exist "%ADB_EXE%" exit /b 20

          del /q Logs\r17-devices-before.txt Logs\r17-devices-after.txt Logs\r17-mdns.txt Logs\r17-mdns-current.txt Logs\r17-connect.txt Logs\r17-server-before.txt Logs\r17-server-after.txt Logs\r17-adb-log-matches.txt 2>nul

          "%ADB_EXE%" version > Logs\r17-adb-version.txt 2>&1
          "%ADB_EXE%" server-status > Logs\r17-server-before.txt 2>&1
          "%ADB_EXE%" devices -l > Logs\r17-devices-before.txt 2>&1
          "%ADB_EXE%" get-state >nul 2>&1
          if not errorlevel 1 goto device_ready

          echo [INFO] No online device; trying current adb server and mDNS first. > Logs\r17-connect.txt
          call :try_mdns
          if not errorlevel 1 goto device_ready

          echo [INFO] mDNS connect did not recover device; trying adb reconnect. >> Logs\r17-connect.txt
          "%ADB_EXE%" reconnect >> Logs\r17-connect.txt 2>&1
          ping -n 4 127.0.0.1 >nul
          "%ADB_EXE%" get-state >nul 2>&1
          if not errorlevel 1 goto device_ready

          echo [INFO] Soft recovery failed; restarting adb server and retrying mDNS. >> Logs\r17-connect.txt
          set "ADB_TRACE=mdns,sockets"
          "%ADB_EXE%" kill-server >nul 2>&1
          "%ADB_EXE%" start-server >> Logs\r17-connect.txt 2>&1
          ping -n 8 127.0.0.1 >nul
          "%ADB_EXE%" server-status > Logs\r17-server-after.txt 2>&1

          call :try_mdns
          if not errorlevel 1 goto device_ready

          set "ADB_LOG=%LOCALAPPDATA%\Temp\adb.log"
          if exist "!ADB_LOG!" (
            findstr /I /C:"_adb-tls-connect._tcp" "!ADB_LOG!" > Logs\r17-adb-log-matches.txt 2>&1
            echo ===== RECENT ADB LOG TLS MATCHES =====
            type Logs\r17-adb-log-matches.txt
          )

          "%ADB_EXE%" devices -l > Logs\r17-devices-after.txt 2>&1
          echo [ERROR] Android device unavailable after soft reconnect, adb restart, and mDNS retries.
          exit /b 30

          :try_mdns
          "%ADB_EXE%" mdns services > Logs\r17-mdns-current.txt 2>&1
          type Logs\r17-mdns-current.txt >> Logs\r17-mdns.txt
          for /f "tokens=1,2,3,4" %%A in ('findstr /C:"_adb-tls-connect._tcp" Logs\r17-mdns-current.txt') do (
            set "ENDPOINT="
            if "%%B"=="_adb-tls-connect._tcp" set "ENDPOINT=%%C"
            if "%%C"=="_adb-tls-connect._tcp" set "ENDPOINT=%%D"
            if defined ENDPOINT (
              echo [INFO] Trying !ENDPOINT! >> Logs\r17-connect.txt
              "%ADB_EXE%" connect !ENDPOINT! >> Logs\r17-connect.txt 2>&1
              ping -n 3 127.0.0.1 >nul
              "%ADB_EXE%" get-state >nul 2>&1
              if not errorlevel 1 exit /b 0
            )
          )
          exit /b 1

          :device_ready
          "%ADB_EXE%" devices -l > Logs\r17-devices-after.txt 2>&1
          echo ===== ADB DEVICES BEFORE =====
          type Logs\r17-devices-before.txt
          echo ===== ADB MDNS =====
          if exist Logs\r17-mdns.txt type Logs\r17-mdns.txt
          echo ===== ADB CONNECT =====
          if exist Logs\r17-connect.txt type Logs\r17-connect.txt
          echo ===== ADB DEVICES AFTER =====
          type Logs\r17-devices-after.txt
          echo [PASS] Android device ready.
          exit /b 0

      - name: Launch R17 and enter game
        shell: cmd
        run: |
          @echo off
          "%ADB_EXE%" logcat -c
          "%ADB_EXE%" shell am force-stop %PACKAGE_ID%
          "%ADB_EXE%" shell monkey -p %PACKAGE_ID% -c android.intent.category.LAUNCHER 1
          if errorlevel 1 exit /b 40
          ping -n 9 127.0.0.1 >nul

          rem Startup orientation can be portrait (1440x3200) or landscape (3200x1440).
          rem Try the actual game-start button center in both coordinate spaces.
          "%ADB_EXE%" shell input tap 720 1840
          ping -n 6 127.0.0.1 >nul
          "%ADB_EXE%" logcat -d -t 5000 > Logs\r17-logcat.txt 2>&1
          findstr /C:"KAI_CHE_R17_3D_ENVIRONMENT_ACTIVE" Logs\r17-logcat.txt >nul
          if not errorlevel 1 goto environment_active

          "%ADB_EXE%" shell input tap 1600 970
          ping -n 6 127.0.0.1 >nul
          "%ADB_EXE%" logcat -d -t 5000 > Logs\r17-logcat.txt 2>&1
          findstr /C:"KAI_CHE_R17_3D_ENVIRONMENT_ACTIVE" Logs\r17-logcat.txt >nul
          if not errorlevel 1 goto environment_active

          rem Small scale/letterbox fallbacks for both orientations.
          "%ADB_EXE%" shell input tap 720 1770
          ping -n 3 127.0.0.1 >nul
          "%ADB_EXE%" shell input tap 1600 900
          ping -n 3 127.0.0.1 >nul
          "%ADB_EXE%" logcat -d -t 5000 > Logs\r17-logcat.txt 2>&1
          findstr /C:"KAI_CHE_R17_3D_ENVIRONMENT_ACTIVE" Logs\r17-logcat.txt >nul
          if not errorlevel 1 goto environment_active

          "%ADB_EXE%" exec-out screencap -p > Logs\r17-game-screen.png 2>nul
          echo [ERROR] R17 3D environment activation marker not found after dual-orientation start taps.
          exit /b 42

          :environment_active
          "%ADB_EXE%" shell pidof %PACKAGE_ID% > Logs\r17-pid.txt 2>&1
          for %%A in (Logs\r17-pid.txt) do if %%~zA EQU 0 (
            echo [ERROR] KaiChe process stopped during R17 smoke.
            exit /b 41
          )

          "%ADB_EXE%" exec-out screencap -p > Logs\r17-game-screen.png 2>nul
          "%ADB_EXE%" logcat -d -t 5000 > Logs\r17-logcat.txt 2>&1
          echo [PASS] R17 Game scene loaded and 3D environment activated.

      - name: Upload R17 device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R17-Environment-Device-Smoke
          path: |
            Logs/r17-adb-version.txt
            Logs/r17-server-before.txt
            Logs/r17-server-after.txt
            Logs/r17-devices-before.txt
            Logs/r17-devices-after.txt
            Logs/r17-mdns.txt
            Logs/r17-mdns-current.txt
            Logs/r17-connect.txt
            Logs/r17-adb-log-matches.txt
            Logs/r17-pid.txt
            Logs/r17-logcat.txt
            Logs/r17-game-screen.png
          if-no-files-found: warn
          retention-days: 7
